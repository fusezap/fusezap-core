  # ------------------------------------------------------------------ AWS Inferentia2
  - chip: aws-inf2
    model: qwen2.5-7b
    status: Preview
    config: bf16, TP=2 (2 NeuronCores, inf2.8xlarge), fusezap serve --tp 2
    verified: 2026-11-01
    gate: Validate accuracy + performance over HTTP (top-1 0.9987, greedy exact 0.9668), prewarm probe PASS
    validate: PROMOTE
    build: "development build, 2026-11-01"
    metrics:
      - {name: TTFT p50 c1 (short), value: 55.4, unit: ms, baseline: "AWS NxD Inference TP=2: 50.6 ms"}
      - {name: TPOT p50 c1, value: 38.8, unit: ms, baseline: "AWS NxD Inference TP=2: 40.6 ms"}
      - {name: output tok/s c4 (short), value: 99.3, baseline: "AWS NxD Inference TP=2: 81.7"}
    tested_with: {neuron_sdk: "2.33.0 (Deep Learning AMI Neuron, Ubuntu 24.04)", instance: inf2.8xlarge}
    evidence:
      - "private: available on request"
    notes: Validate perf ran 1 repeat, 8 requests per point. The AWS baseline is NxD Inference TP=2 run offline on the same instance type.

  - chip: aws-inf2
    model: qwen2.5-0.5b
    status: Preview
