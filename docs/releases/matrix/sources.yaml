# FuseZap support matrix: the hand-maintained source (schema fusezap.matrix/v1).
#
# Rendered by scripts/release_matrix.py (markdown for release notes, JSON for the website /matrix page, an HTML
# fragment) and validated by `scripts/release.py check`. `release.py cut X.Y.Z` freezes a copy as vX.Y.Z.yaml next
# to this file; edit this file, never a frozen copy. Field reference: docs/releases/matrix/README.md.
#
# Status rules:
#   Supported     from the first public release: passed a gate on real hardware (Validate PROMOTE or a package gate), evidence resolves
#   Preview       ran on real hardware in a development build (every cell until the first public release); gate and caveats in the cell
#   Experimental  simulator or behind a flag only
#   Planned       not run (no evidence, no metrics, no date promised)
#
# Evidence: a path in this repository, or "private: available on request" for evidence that exists
# but is not published (raw run logs, FuseZap Validate reports). Ask hello@fusezap.ai or open an issue.

