# CPU tests for the public FuseZap Core repository. Hardware tiers (CUDA, METAL, NEURON) are not run here: they skip
# without the hardware. The jobs run only in the public repository and its private pre-publish copy
# (fusezap-core-staging), not in the private source repo, which carries the same file.
name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cpu:
    if: contains(fromJSON('["fusezap/fusezap-core", "fusezap/fusezap-core-staging"]'), github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FZ_TEST_TIERS: interp,NPY,CPU
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - name: Install clang (the CPU backend compiles C with it)
        run: sudo apt-get update && sudo apt-get install -y clang
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --extra serve
      - name: Test
        run: uv run pytest -n auto -q -rs

  build:
    if: contains(fromJSON('["fusezap/fusezap-core", "fusezap/fusezap-core-staging"]'), github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the wheel and sdist
        run: uv build
      - name: The wheel and sdist import and serve --help
        run: |
          uv venv /tmp/wheel-venv
          uv pip install --python /tmp/wheel-venv/bin/python "$(ls dist/*.whl)[serve]"
          /tmp/wheel-venv/bin/python -c "import fusezap; print(fusezap.__version__)"
          /tmp/wheel-venv/bin/fusezap serve --help > /dev/null

  dco:
    # Developer Certificate of Origin: every commit in a pull request carries a Signed-off-by line that matches its
    # author (git commit -s; CONTRIBUTING.md). Plain git, no third-party action; commit text is only read, never run.
    name: DCO
    if: github.event_name == 'pull_request' && contains(fromJSON('["fusezap/fusezap-core", "fusezap/fusezap-core-staging"]'), github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if git log -1 --format=%B "$c" | grep -qiF "Signed-off-by: $author"; then
              echo "ok   $c"
            else
              echo "::error::commit $c has no 'Signed-off-by: $author' line (use git commit -s)"; bad=1
            fi
          done
          exit $bad
